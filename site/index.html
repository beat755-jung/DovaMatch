<style>
  body { margin: 0; font-family: -apple-system, Segoe UI, sans-serif; display: flex; height: 100vh; }
  #list { width: 280px; overflow-y: auto; border-right: 1px solid #ddd; background: #fafafa; }
  #list button {
    display: block; width: 100%; text-align: left; padding: 12px 16px;
    border: none; border-bottom: 1px solid #eee; background: none; cursor: pointer; font-size: 14px;
  }
  #list button:hover, #list button.active { background: #e8ecff; }
  #list button.info-btn { font-weight: 600; background: #eef1ff; }
  #list .divider { border-bottom: 2px solid #ccc; }
  #detail { flex: 1; overflow-y: auto; padding: 32px 40px; }
  .detail-grid { display: flex; gap: 40px; align-items: flex-start; }
  .detail-text { flex: 1 1 50%; min-width: 0; }
  .detail-image { flex: 1 1 50%; min-width: 0; position: sticky; top: 32px; }
  .detail-image img { width: 100%; height: auto; border-radius: 8px; display: block; }
  .detail-text h1 { margin-top: 0; }
  .meta { color: #555; margin-bottom: 4px; }
  .bio { margin-top: 6px; line-height: 1.7; white-space: pre-wrap; }
  .bio-label {
    margin-top: 20px; font-size: 12px; font-weight: 700; color: #888;
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  .events { margin-top: 24px; }
  .event { margin-bottom: 12px; padding: 10px 14px; background: #f4f4f8; border-radius: 6px; }
  a { color: #3b53d8; }
  .placeholder { color: #888; }
  #list .section-label {
    padding: 10px 16px 4px; font-size: 12px; font-weight: 700; color: #888;
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  .analysis { margin-top: 24px; }
  .analysis h2 { font-size: 16px; border-bottom: 1px solid #eee; padding-bottom: 6px; }
  .analysis .philosophy { font-style: italic; line-height: 1.7; color: #333; }
  .keyword-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .keyword-tag {
    background: #eef1ff; color: #3b53d8; border-radius: 999px;
    padding: 4px 12px; font-size: 13px;
  }
  .exhibition-list { margin: 6px 0 0; padding-left: 18px; line-height: 1.7; }
  .review-note { color: #888; font-size: 12px; margin-top: 4px; }
  .info-page section { margin-bottom: 32px; max-width: 900px; }
  .info-page h2 { border-bottom: 2px solid #eee; padding-bottom: 6px; }
  .info-page table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  .info-page th, .info-page td { text-align: left; padding: 10px 12px; border: 1px solid #e0e0e0; vertical-align: top; white-space: pre-line; }
  .info-page th { background: #f4f4f8; }
  .info-page .tip { color: #666; font-size: 13px; }
  .score-cards { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 10px; }
  .score-card { background: #f4f4f8; border-radius: 8px; padding: 12px 18px; min-width: 100px; }
  .score-card .label { font-size: 12px; color: #666; }
  .score-card .value { font-size: 20px; font-weight: 700; }
  .stage-list { margin-top: 10px; display: flex; flex-direction: column; gap: 10px; }
  .stage-card { background: #f4f4f8; border-left: 4px solid #3b53d8; border-radius: 6px; padding: 12px 16px; }
  .stage-card .range { font-weight: 700; margin-bottom: 4px; }
  .code-block {
    background: #2b2b2b; color: #eee; font-family: Consolas, monospace; font-size: 13px;
    padding: 10px 14px; border-radius: 6px; margin: 6px 0; white-space: pre-wrap;
  }
  .pitfall-list { margin: 6px 0 0; padding-left: 18px; line-height: 1.8; }
  .summary-box {
    background: #eef1ff; border-radius: 8px; padding: 16px 20px; margin-top: 12px;
    line-height: 1.7; font-weight: 500;
  }
  @media (max-width: 800px) {
    .detail-grid { flex-direction: column; }
    .detail-image { position: static; }
  }
</style>
</head>

<script id="faculty-data" type="application/json">[{"name": "Mari Eastman", "title": "Faculty", "url": "https://dova.uchicago.edu/people/mari-eastman", "image": "https://dova.uchicago.edu/sites/default/files/styles/header_image/public/2024-02/MEA-23-20_M1A3181_header3_0.jpg?itok=6IA_jVS6", "email": "marieastman@uchicago.edu", "office": "Logan Center 240", "teaching_since": "Teaching at UChicago since 2024", "homepage": "", "bio": "Mari Eastman (b.1970, San Francisco, CA) holds an MFA from the School of the Art Institute of Chicago and a BA from Smith College. She has been in exhibitions at the Hammer Museum, Los Angeles, the Berkeley Museum of Art, and had solo shows at Los Angeles Contemporary Exhibitions, Sprüth and Magers Projekte, among others. Recent solo shows include The Green Gallery in Milwaukee and Bombon Projects in Barcelona, Spain. Her work has been reviewed in the New York Times, Artforum.com, and featured in Contemporary Art Daily. Eastman lives and works in Chicago and is on the faculty at DoVA at the University of Chicago.", "bio_ko": "마리 이스트먼(1970년 캘리포니아 샌프란시스코 출생)은 시카고 예술대학(SAIC)에서 MFA를, 스미스 칼리지에서 학사 학위를 받았다. LA의 해머 뮤지엄, 버클리 미술관 등에서 전시를 가졌으며, Los Angeles Contemporary Exhibitions, Sprüth Magers Projekte 등에서 개인전을 열었다. 최근에는 밀워키의 The Green Gallery와 스페인 바르셀로나의 Bombon Projects에서 개인전을 가졌다. 그의 작업은 뉴욕 타임스, Artforum.com에서 리뷰되었고 Contemporary Art Daily에 소개되었다. 이스트먼은 시카고에 거주하며 작업하고 있으며 시카고 대학교 DoVA 교수진이다.", "events": [], "artwork_images": ["https://dova.uchicago.edu/sites/default/files/styles/header_image/public/2024-02/MEA-23-20_M1A3181_header3_0.jpg?itok=6IA_jVS6"], "philosophy": "Mari Eastman (b.1970, San Francisco, CA) holds an MFA from the School of the Art Institute of Chicago and a BA from Smith College.", "academic_orientation_ko": "공개된 프로필에는 구체적인 작업 철학 진술이 포함되어 있지 않아, 학문적 성향을 단정하기는 어렵다. 다만 LA Hammer Museum, Sprüth Magers Projekte 등에서 꾸준히 개인전을 열어온 전시 이력으로 미루어, 회화를 중심으로 대중문화적 이미지를 다루는 작업으로 추정된다. (※ 다른 교수진과 달리 근거가 제한적인 항목이므로, 실제 작업론은 원문 인터뷰나 작가 노트를 통해 별도 확인을 권장.)", "visual_languages": [], "key_exhibitions": ["Art Institute of Chicago", "Hammer Museum", "Berkeley Museum of Art", "The Green Gallery"]}, {"name": "Matthew Jesse Jackson", "title": "Professor, Visual Arts, Professor, Art History", "url": "https://dova.uchicago.edu/people/matthew-jesse-jackson", "image": "https://dova.uchicago.edu/sites/default/files/styles/header_image/public/2025-02/22POPEL1-superJumbo.jpg?itok=qhzXlvXx", "email": "", "office": "Logan Center 236", "teaching_since": "", "homepage": "", "bio": "Matthew Jesse Jackson teaches courses grounded primarily in the contemplation of cultural experience since 1945.  Jackson’s most recent monograph, Il’ia i Emiliia Kabakovy: Gde nashe mesto? [Ilya and Emilia Kabakov: Where Is Our Place?] (Moscow: Breus Foundation, 2019), presents a comprehensive Russian-language survey of Russia’s most famous living artists.  Jackson is also the editor and co-translator from the Russian of Ilya Kabakov: On Art (University of Chicago Press, 2018), the definitive collection of Kabakov’s writings in English, and the author of The Experimental Group: Ilya Kabakov, Moscow Conceptualism, Soviet Avant-Gardes (University of Chicago Press, 2010; new paperback edition, 2016), winner of the Robert Motherwell Book Award from The Dedalus Foundation for outstanding publication in the history and criticism of modernism in the arts, as well as the Vucinich Book Prize for the most important contribution to Russian, Eurasian, and East European studies in any discipline of the humanities or social sciences from the Association for Slavic, East European, and Eurasian Studies; the prize citation reads, in part: “ Matthew Jesse Jackson's The Experimental Group is an engaging, beautifully written, and erudite study of unofficial Soviet art. It provides brilliant readings of numerous individual drawings, albums, mixed media work, and installations…[T]his monumental study of creativity in and after the late Soviet period is a remarkable scholarly achievement.” The volume was also named runner-up for Book of the Year in art history and criticism at the American Publishers (PROSE) Awards and placed on the short list for Book of the Year by the American Association of Teachers of Slavic and East European Languages (AATSEEL). Jackson earned a Ph.D. in History of Art from the University of California, Berkeley, thanks to Anne M. Wagner and T.J. Clark, and is also A.B.D. in Russian Literature, having been awarded M.Phil. and M.A. degrees from Columbia University, where he studied as a President’s Fellow. He graduated Phi Beta Kappa summa cum laude with a B.A. in French and German from the Florida State University.", "bio_ko": "매튜 제시 잭슨은 1945년 이후의 문화적 경험에 대한 고찰을 중심으로 한 수업을 가르친다. 그의 최근 저서 「일리야와 에밀리아 카바코프: 우리의 자리는 어디인가?」(모스크바: 브레우스 재단, 2019)는 러시아어로 쓰인 포괄적인 연구로, 러시아에서 가장 유명한 생존 작가들을 다룬다. 잭슨은 또한 「일리야 카바코프: 예술론」(시카고대학교 출판부, 2018 — 카바코프의 글을 영어로 옮긴 결정판)의 편집자이자 공동 번역자이며, 「실험 그룹: 일리야 카바코프, 모스크바 개념주의, 소비에트 아방가르드」(시카고대학교 출판부, 2010; 2016년 페이퍼백 재출간)의 저자다. 이 책은 데덜러스 재단의 로버트 마더웰 도서상, 슬라브·동유럽·유라시아학회(ASEEES)의 부치니치 도서상을 수상했으며, 미국출판협회(PROSE) 어워드 미술사·비평 부문 차석과 미국 슬라브·동유럽어 교사협회(AATSEEL) 올해의 책 후보에도 올랐다. 잭슨은 앤 M. 와그너와 T.J. 클라크의 지도 아래 UC 버클리에서 미술사 박사 학위를 받았고, 컬럼비아 대학교에서 대통령 펠로우로 러시아 문학 석사(M.Phil., M.A.) 과정을 마쳤다. 플로리다 주립대학교에서 프랑스어·독일어 학사를 최우등(summa cum laude, 파이베타카파)으로 졸업했다.", "events": [], "artwork_images": ["https://dova.uchicago.edu/sites/default/files/styles/header_image/public/2025-02/22POPEL1-superJumbo.jpg?itok=qhzXlvXx"], "philosophy": "Matthew Jesse Jackson teaches courses grounded primarily in the contemplation of cultural experience since 1945.", "academic_orientation_ko": "소비에트·러시아 비공식 미술(모스크바 개념주의)을 다루는 미술사학자로서, 1945년 이후 문화적 경험에 대한 고찰을 축으로 삼는다. 일리야 카바코프 연구·번역을 통해 냉전기 예술이 국가 이데올로기와 개인 서사 사이에서 어떻게 발화했는지를 추적하며, 이는 역사적 텍스트를 현재적 관점에서 재해석하는 DoVA의 성향과 맞닿아 있다.", "visual_languages": ["cultural experience", "monograph", "drawing", "mixed media", "installation"], "key_exhibitions": ["Breus Foundation", "The Dedalus Foundation"]}, {"name": "Laura Letinsky", "title": "Professor, Visual Arts", "url": "https://dova.uchicago.edu/people/laura-letinsky", "image": "https://dova.uchicago.edu/sites/default/files/styles/header_image/public/2019-08/RNToWantForNothing02-Proof_0.jpg?itok=1TgLMMNi", "email": "", "office": "Logan Center 240", "teaching_since": "Teaching at UChicago since 1994", "homepage": "http://lauraletinsky.com/", "bio": "A BFA from the University of Manitoba, Winnipeg, Canada, and a MFA in Photography from Yale University’s School of Art, Laura Letinsky has been a Professor at the University of Chicago since 1994. She shows with Yancey Richardson Gallery, NYC, and Document, Chicago and Lisbon, and exhibits internationally including PhotoEspana, Madrid, Museum of Modern Art, NYC, Mumbai Photography Festival, Mumbai, India, MIT, Cambridge, MA,Basel Design, The Photographers Gallery, London, and , Denver Art Museum, CO. Awards include the Maison Dora Maar Residency, France; Canada Council International Residency, Kunstlerhaus Bethanien Residency, Berlin, The Canada Council Project Grants, The Anonymous Was a Woman Award, and the John Simon Guggenheim Fellowship, and her work is published in monographs and catalogues such as To Want For Nothing , Roman Nvmerals, 2019, Time’s Assignation , Radius Books, 2017, Ill Form and Void Full , Radius Books, 2014, Feast , Smart Museum of Art, UC Press, 2013, After All , Damiani, 2010, Hardly More Than Ever , Renaissance Society, 2004, Blink , Phaidon Press, 2002, and Venus Inferred , University of Chicago Press, 2000. lauraletinsky.com", "bio_ko": "로라 레틴스키는 캐나다 매니토바 대학교에서 BFA를, 예일대학교 미술대학원에서 사진 전공 MFA를 받았으며 1994년부터 시카고 대학교 교수로 재직 중이다. 뉴욕의 Yancey Richardson Gallery, 시카고·리스본의 Document 갤러리와 함께 활동하며, 마드리드 PhotoEspaña, 뉴욕 현대미술관(MoMA), 뭄바이 사진 페스티벌, MIT, 런던 The Photographers Gallery, 덴버 미술관 등 국제적으로 전시해왔다. Maison Dora Maar 레지던시(프랑스), 캐나다 카운슬 국제 레지던시, 베를린 Künstlerhaus Bethanien 레지던시, Anonymous Was a Woman Award, 존 사이먼 구겐하임 펠로우십 등을 수상했다. 그의 작업은 『To Want For Nothing』(2019), 『Time's Assignation』(2017), 『Ill Form and Void Full』(2014), 『Feast』(2013), 『After All』(2010), 『Hardly More Than Ever』(2004), 『Blink』(2002), 『Venus Inferred』(2000) 등 여러 화집·도록으로 출간되었다.", "events": [], "artwork_images": ["https://dova.uchicago.edu/sites/default/files/styles/header_image/public/2019-08/RNToWantForNothing02-Proof_0.jpg?itok=1TgLMMNi"], "philosophy": "A BFA from the University of Manitoba, Winnipeg, Canada, and a MFA in Photography from Yale University’s School of Art, Laura Letinsky has been a Professor at the University of Chicago since 1994.", "academic_orientation_ko": "17세기 네덜란드 정물화의 구도를 현대 소비사회와 연결 짓는 사진 작업을 한다. 식사가 끝난 뒤 남은 음식 찌꺼기, 찌그러진 일회용 컵 등이 테이블 가장자리에 아슬아슬하게 걸쳐진 풍경을 자연광으로 담아낸다. 이는 단순한 정물이 아니라 완벽함에 대한 환상을 깨는 일상의 잔해이자, 사진이라는 평면 매체가 지닌 시각적 한계와 지각의 불완전성을 폭로하는 학문적 질문이다.", "visual_languages": ["photography", "monograph"], "key_exhibitions": ["Yancey Richardson Gallery", "Museum of Modern Art", "Mumbai Photography Festival", "The Photographers Gallery", "Denver Art Museum", "Smart Museum of Art"]}, {"name": "Geof Oppenheimer", "title": "Associate Professor of Practice, Visual Arts", "url": "https://dova.uchicago.edu/profiles/geof-oppenheimer", "image": "https://dova.uchicago.edu/sites/default/files/styles/header_image/public/2022-03/011_GO.JPG?itok=8ZfOE05F", "email": "", "office": "Logan Center 239", "teaching_since": "", "homepage": "http://inthisdayandage.net/", "bio": "Geof Oppenheimer’s practice takes up questions about the negotiation of civic value and how meaning is formed (and fails) in the modern world.  Starting from the proposition that formal value is a social value, his projects interrogate the forms and rules of civic discourse as a material, positing art as a space of liberated social dialogue. Trained as a sculptor, Oppenheimer works across multiple mediums including stage set video productions and photography. His work has been exhibited nationally and internationally at venues such as the CRP in France, the Mary and Leigh Block Museum of Art, UCCA, Bejing, PS1/MOMA, The Contemporary Museum, Baltimore; The Museum of Contemporary Art, Chicago, SITE Santa Fe, The Indianapolis Museum of Art, The Aspen Art Museum, The 4th Athens Biennale, The Institute for Contemporary Art in Richmond, Virginia and the CAB Art Center, Brussels. His work has been the subject of published writings in Art in America, The Wall Street Journal, The Chicago Tribune and The New Yorker. He studied at the Maryland Institute, College of Art where he received his BFA and received an MFA from the University of California, Berkeley. He also studied at the Academia voor Beeldende Vorming in the Netherlands. Geof Oppenheimer is an Associate Professor of Practice in the Department of Visual Arts at the University of Chicago and lives and works in Chicago, Illinois. inthisdayandage.net", "bio_ko": "제프 오펜하이머의 작업은 시민적 가치(civic value)의 협상과, 현대 세계에서 의미가 형성되고(또는 형성에 실패하고) 있는 방식에 대한 질문을 다룬다. 형식적 가치가 곧 사회적 가치라는 전제에서 출발해, 그의 프로젝트는 시민 담론(civic discourse)의 형식과 규칙을 하나의 물질로 다루며 심문하고, 예술을 해방된 사회적 대화의 공간으로 제시한다. 조각을 전공한 오펜하이머는 무대 세트, 영상, 사진 등 다양한 매체를 넘나들며 작업한다. 프랑스 CRP, Mary and Leigh Block 미술관, 베이징 UCCA, PS1/MOMA, 볼티모어 The Contemporary Museum, 시카고 현대미술관, SITE Santa Fe, 인디애나폴리스 미술관, 아스펜 미술관, 제4회 아테네 비엔날레, 버지니아 리치먼드의 The Institute for Contemporary Art, 브뤼셀 CAB Art Center 등 국내외 다수 기관에서 전시했다. 그의 작업은 Art in America, The Wall Street Journal, The Chicago Tribune, The New Yorker 등에 소개되었다. 메릴랜드 인스티튜트 칼리지 오브 아트에서 BFA를, UC 버클리에서 MFA를 받았으며 네덜란드 Academie voor Beeldende Vorming에서도 수학했다. 현재 시카고 대학교 미술학과 Associate Professor of Practice로 재직하며 시카고에 거주·작업한다.", "events": [], "artwork_images": ["https://dova.uchicago.edu/sites/default/files/styles/header_image/public/2022-03/011_GO.JPG?itok=8ZfOE05F"], "philosophy": "Geof Oppenheimer’s practice takes up questions about the negotiation of civic value and how meaning is formed (and fails) in the modern world. Starting from the proposition that formal value is a social value, his projects interrogate the forms and rules of civic discourse as a material, positing art as a space of liberated social dialogue.", "academic_orientation_ko": "그의 조각과 영상 작업은 노동, 계급, 자본주의 시스템을 정면으로 다룬다. 화이트칼라의 상징인 정장 바지가 조각상 발목에 흘러내린 '당혹스러운 조각(Embarrassing Sculpture)'이나 중장비와 대리석을 결합한 작업 등을 통해, 현대 자본주의 구조가 개인의 신체와 정신에 어떻게 압력을 가하는지 정교한 조각 언어로 질문한다. 미술학과뿐 아니라 정치학과(Political Science) 부교수를 겸임하며 예술적 실천과 정치 이론을 직접 연결짓는 등, 학제 간 융합 지향이 뚜렷하다.", "visual_languages": ["civic discourse", "stage set", "video", "photography", "biennale"], "key_exhibitions": ["Leigh Block Museum of Art", "The Contemporary Museum", "The Museum of Contemporary Art", "The Indianapolis Museum of Art", "The Aspen Art Museum", "Athens Biennale", "The Institute for Contemporary Art", "CAB Art Center"]}, {"name": "Julia Phillips", "title": "Assistant Professor, Visual Arts", "url": "https://dova.uchicago.edu/people/julia-phillips", "image": "https://dova.uchicago.edu/sites/default/files/styles/header_image/public/2019-09/J-Phillips_Witness_I-III_DoVA-web.jpg?itok=cZMgImpf", "email": "juliaphillips@uchicago.edu", "office": "Logan Center 240", "teaching_since": "Teaching at UChicago since 2018", "homepage": "", "bio": "Alongside works on paper and videos, Julia Phillips works primarily with ceramics and metal, creating sculptures reminiscent of functional objects. Her works are metaphors for social and psychological experiences, metaphors that are both mechanical and bodily, and that typically focus on experiences of power relations between individuals or between an individual and an institution. Julia Phillips (b. 1985) was born in Hamburg and lives and works in Chicago and Berlin. She has had solo exhibitions at MoMA PS1 in New York and Kunstverein Braunschweig, and was featured in the Berlin Biennial, the New Museum Triennial, the Venice Biennial, and the Whitney Biennial. Her work has been shown at museums including the Museum of Fine Arts in Boston, the Museum Brandhorst in Munich, the Museu de Arte de São Paulo, and the Studio Museum in Harlem. Her work is held in numerous public collections including the Art Institute of Chicago, the Museum MMK für Moderne Kunst in Frankfurt a. M., the Moderna Museet in Stockholm, and the Museum of Modern Art New York. Julia Phillips recently completed her first public art work commission titled Observer, Observed for the NY High Line and published her first monograph titled “Energy Exchange” with Mousse Publishing, Milan. 'Reach Everyone on the Planet…' — Kimberlé Crenshaw and Intersectionality , text contribution 'Can We Get a Witness?' from Julia Phillips, published by Gunda-Werner-Institute in the Heinrich Böll Foundation, in cooperation with the Center for Intersectional Justice, 2019 Review of Solo Exhibition ' Failure Detection ' at MoMA PS1, Sculpture Magazine, Jan/Feb 2019, issue by Jonathan Goodman, 2019 Review of Solo Exhibition ' Failure Detection ' at MoMA PS1, Zack Hatfield, Artforum , September 2018 issue, Vol. 57, No. 1 , 2018 \"In Minimalism Everything Counts\", Interview with Will Furtado, Contemporary& Magazine , Print Issue #9 , 2018 \"Do You Believe in Evil?\", In Conversation with Aaron Gilbert, Mousse Magazine, Issue 62 , 2018 \"New Album\" , Solo, Matthew Marks Gallery, NYC, 2020 \"Fake Truth\" , Solo, Kunstverein Braunschweig, Germany, 2019 \"Failure Detection\" , Solo, MoMA PS1, New York City, USA, 2018 \"Feminist Histories: Artists After 2000\" , Group, MASP, São Paulo, Brasil, 2019 \"Performing Society: The Violence of Gender\" , Group, Tai Kwun Art Center, Hong Kong, China, 2019 \"We don’t need another hero\" , Group, 10th Berlin Biennale, Berlin, Germany, 2018 \"Songs for Sabotage\" , Group, New Museum Triennial, New York City, USA, 2018", "bio_ko": "줄리아 필립스는 종이 작업과 영상 외에도 주로 도자기와 금속을 이용해 기능적 사물을 연상시키는 조각을 만든다. 그의 작품은 사회적·심리적 경험에 대한 은유로, 기계적이면서도 신체적인 은유이며 개인 간, 혹은 개인과 제도 사이의 권력 관계(power relations) 경험에 초점을 맞추는 경우가 많다. 줄리아 필립스(1985년생)는 함부르크에서 태어나 시카고와 베를린을 오가며 활동한다. 뉴욕 MoMA PS1과 브라운슈바이크 쿤스트페어라인에서 개인전을 가졌고, 베를린 비엔날레, 뉴뮤지엄 트리엔날레, 베니스 비엔날레, 휘트니 비엔날레에 참여했다. 보스턴 미술관, 뮌헨 브란트호르스트 미술관, 상파울루 미술관, 할렘 스튜디오 뮤지엄 등에서 전시했으며, 시카고 아트 인스티튜트, 프랑크푸르트 MMK 현대미술관, 스톡홀름 모데르나 무제트, 뉴욕 현대미술관 등 다수의 공공 컬렉션에 소장되어 있다. 최근 뉴욕 하이라인의 공공미술 커미션 「Observer, Observed」를 완성했고, 첫 화집 『Energy Exchange』(무스 퍼블리싱, 밀란)를 출간했다.", "events": [], "artwork_images": ["https://dova.uchicago.edu/sites/default/files/styles/header_image/public/2019-09/J-Phillips_Witness_I-III_DoVA-web.jpg?itok=cZMgImpf"], "philosophy": "Her works are metaphors for social and psychological experiences, metaphors that are both mechanical and bodily, and that typically focus on experiences of power relations between individuals or between an individual and an institution.", "academic_orientation_ko": "세라믹과 금속 장치 등을 결합해 신체를 구속하거나 지지하는 듯한 독특한 조각을 만든다. 이는 타인과의 관계 속에 존재하는 권력 구조, 억압, 그리고 젠더와 인종을 둘러싼 사회적 시스템을 신체적 경험(Bodily Experience)을 통해 시각화하는 개념적 성향을 띤다.", "visual_languages": ["biennial", "sculpture", "triennial", "works on paper", "video", "ceramics", "metal", "power relations", "monograph", "intersectionality"], "key_exhibitions": ["MoMA PS1", "Kunstverein", "Berlin Biennial", "New Museum Triennial", "Venice Biennial", "Whitney Biennial", "Museum of Fine Arts", "Museum"]}, {"name": "Tongji Philip Qian 钱同济", "title": "Harper-Schmidt Fellow, Collegiate Assistant Professor, Visual Arts", "url": "https://dova.uchicago.edu/people/tongji-philip-qian-qiantongji", "image": "https://dova.uchicago.edu/sites/default/files/styles/header_image/public/2023-09/DSC_7277.JPG?itok=t4rJ6eSu", "email": "qiantjp@uchicago.edu", "office": "Logan Center 239", "teaching_since": "", "homepage": "", "bio": "Tongji Philip Qian 钱同济 is a multidisciplinary artist and the co-founder of TPQ Studio. His artistic practice extends the limit of artmaking through conceptual lenses such as speed, labor, internationalism, and immigration. Rooted in images and words, Qian’s research investigates knowledge production in contemporary art with a scholarly focus on movements such as Minimalism, Post-Minimalism, and Conceptual art. His recent projects include No-risk Hour (2019-), Neighborly Passport Keep Right Except To Pass (2023), Questionnairing Reality (2021) , and Art Beside a Single Handshake (2020). Qian’s drawings and paintings are represented in several permanent collections, including the RISD Museum, Mecklenburgisches Künstlerhaus Schloss Plüschow, and the Yangdeng Art Museum, whereas his artist books are housed in a large number of public collections, such as Special Collections at Smith College, Special Collections at the Center for Curatorial Studies Library and Archives at Bard College, Booth Family Center for Special Collections at Georgetown University, Center for Book Arts in New York, and Asia Art Archive in America. Qian earned dual B.A. degrees in Art History and Mathematics from Carleton College, an Advanced Graduate Certificate in Studio Art from New York University, and an M.F.A. from the Rhode Island School of Design. He has held teaching positions at Bard College and RISD, and currently serves as a Collegiate Assistant Professor in the Department of Visual Arts and a Harper-Schmidt Fellow in the Society of Fellows, both at the University of Chicago. In spring 2024, Qian inaugurated the State VIII Project (2024-2027), a quasi research-driven project space within his office studio at the Hyde Park Art Center in Chicago. The initiative features a series of two-person exhibitions, having highlighted works by Sol LeWitt, McKinzie Trotta, Wang Langgou, Dasha Shishkin, Braden Bandel, Save the Chimps, Grappa, and Jonathan Monk. In conjunction with the exhibitions, Qian also founded the State VIII Project Artist and Writer Residency Program , a free-of-charge experience offering creative professionals uninterrupted time and space to consider their work.", "bio_ko": "통지 필립 첸(钱同济)은 다학제적 아티스트이자 TPQ 스튜디오의 공동 설립자다. 그의 작업은 속도, 노동, 국제주의, 이민이라는 개념적 렌즈를 통해 예술 창작의 한계를 확장한다. 이미지와 언어에 뿌리를 둔 첸의 연구는 미니멀리즘, 포스트미니멀리즘, 개념미술 등의 사조를 학문적으로 조명하며 동시대 미술의 지식 생산을 탐구한다. 최근 프로젝트로는 「No-risk Hour」(2019~), 「Neighborly Passport Keep Right Except To Pass」(2023), 「Questionnairing Reality」(2021), 「Art Beside a Single Handshake」(2020) 등이 있다. 그의 드로잉과 회화는 RISD 미술관, 메클렌부르크 클뤼쇼 쿤스틀러하우스, 양덩 미술관 등 여러 영구 소장품으로 소장되어 있으며, 아티스트북은 스미스 칼리지, 바드 칼리지 큐레이터 연구센터, 조지타운 대학교, 뉴욕 Center for Book Arts, 아시아 아트 아카이브 등 다수의 공공 컬렉션에 소장되어 있다. 칼턴 칼리지에서 미술사·수학 복수 학사, 뉴욕대학교에서 스튜디오 아트 심화과정 수료, 로드아일랜드 디자인스쿨(RISD)에서 MFA를 받았다. 바드 칼리지와 RISD에서 강의했으며, 현재 시카고 대학교 미술학과 Collegiate Assistant Professor이자 Society of Fellows의 Harper-Schmidt Fellow로 재직 중이다. 2024년 봄, 하이드 파크 아트센터 내 자신의 스튜디오 공간에 State VIII Project(2024~2027)를 개설해 2인전 시리즈를 기획하고 있으며, 창작자들에게 무료로 시간과 공간을 제공하는 State VIII Project Artist and Writer Residency Program도 함께 설립했다.", "events": [{"title": "Tongji Philip Qian: Alloyed Commitments", "url": "https://dova.uchicago.edu/events/tongji-philip-qian-alloyed-commitments", "date": "24 October 2025 6:00PM", "host": "Logan Center Exhibitions", "location": "Logan Center for the Arts"}, {"title": "Reiko Tomii: “Thinking Operationally”", "url": "https://dova.uchicago.edu/events/reiko-tomii-thinking-operationally", "date": "15 May 2024 4:45PM", "host": "VMPEA", "location": "Cochrane-Woods Art Center, Room 152"}, {"title": "Tongji Philip Qian: \"The Diary of An Encounter Which Seemed to Have Never Happened\"", "url": "https://dova.uchicago.edu/events/tongji-philip-qian-diary-encounter-which-seemed-have-never-happened", "date": "12 February 2024 6:00PM", "host": "Open Practice Committee", "location": "Logan Center for the Arts"}], "artwork_images": ["https://dova.uchicago.edu/sites/default/files/styles/header_image/public/2023-09/DSC_7277.JPG?itok=t4rJ6eSu"], "philosophy": "His artistic practice extends the limit of artmaking through conceptual lenses such as speed, labor, internationalism, and immigration. Rooted in images and words, Qian’s research investigates knowledge production in contemporary art with a scholarly focus on movements such as Minimalism, Post-Minimalism, and Conceptual art.", "academic_orientation_ko": "속도, 노동, 국제주의, 이민이라는 개념적 렌즈로 예술 창작의 한계를 확장하며, 미니멀리즘·포스트미니멀리즘·개념미술의 계보를 학문적으로 재조명한다. 하이드 파크 아트센터 내 자신의 스튜디오에 리서치 기반 프로젝트 스페이스(State VIII Project)를 설립해 큐레이팅과 레지던시 프로그램을 병행하는 등, 창작과 담론 생산·기관 운영을 통합하는 지향을 보인다.", "visual_languages": ["minimalism", "archive", "labor", "internationalism", "immigration", "knowledge production", "post-minimalism", "conceptual art", "drawing", "painting"], "key_exhibitions": ["Tongji Philip Qian: Alloyed Commitments (24 October 2025 6:00PM)", "Reiko Tomii: “Thinking Operationally” (15 May 2024 4:45PM)", "Tongji Philip Qian: \"The Diary of An Encounter Which Seemed to Have Never Happened\" (12 February 2024 6:00PM)", "RISD Museum", "Yangdeng Art Museum", "Center for Curatorial Studies Library", "Booth Family Center for Special Collections", "Center for Book Arts"]}, {"name": "Jason Salavon", "title": "Associate Professor, Visual Arts", "url": "https://dova.uchicago.edu/people/jason-salavon", "image": "https://salavon.com/site_media/projects/todem/openseaLogo.png", "email": "", "office": "Logan Center 239", "teaching_since": "", "homepage": "http://salavon.com/", "bio": "Using software processes of his own design, Jason Salavon generates and reconfigures masses of communal material in an effort to present new perspectives on the familiar. His projects unearth unexpected pattern while exploring the relationship between the part and the whole or the individual and the group. Reflecting a natural attraction to popular culture and the day-to-day, his work regularly incorporates the use of common references and source material. The final compositions are exhibited as art objects, such as photographic prints and video installations, while others exist in a real-time software context. Born in Indiana, raised in Texas, and based in Chicago, Salavon earned his MFA at The School of the Art Institute of Chicago and his BA from The University of Texas at Austin. His work has been shown in museums and galleries around the world. Reviews of his exhibitions have been included in such publications as Artforum, Art in America, The New York Times, and The Wall Street Journal. Examples of his artwork are included in numerous prominent public and private collections. He is currently an Associate Professor in Visual Arts and Faculty in the Computation Institute, at the University of Chicago. He was also employed for numerous years as an artist and programmer in the video game industry. salavon.com", "bio_ko": "제이슨 살라본은 자신이 설계한 소프트웨어 프로세스를 이용해 방대한 공동체의 자료를 생성·재구성함으로써 익숙한 것에 대한 새로운 시각을 제시한다. 그의 프로젝트는 부분과 전체, 개인과 집단의 관계를 탐구하며 예상치 못한 패턴을 발굴한다. 대중문화와 일상에 대한 자연스러운 관심을 반영하듯, 그의 작업은 흔히 접하는 참조물과 소스 자료를 규칙적으로 활용한다. 최종 작품은 사진 인화나 비디오 설치와 같은 예술 오브제로 전시되거나, 실시간 소프트웨어 형태로 존재하기도 한다. 인디애나에서 태어나 텍사스에서 자란 살라본은 시카고를 기반으로 활동하며, 시카고 예술대학(SAIC)에서 MFA를, 텍사스 대학교 오스틴에서 학사를 받았다. 그의 작업은 전 세계 미술관과 갤러리에서 전시되었고, Artforum, Art in America, 뉴욕 타임스, 월스트리트 저널 등에 리뷰가 실렸다. 다수의 유수 공공·개인 컬렉션에 그의 작품이 소장되어 있다. 현재 시카고 대학교 미술학과 부교수이자 계산연구소(Computation Institute) 교수로 재직 중이며, 과거 오랜 기간 비디오게임 업계에서 아티스트 겸 프로그래머로 일한 경력이 있다.", "events": [], "artwork_images": ["https://salavon.com/site_media/projects/todem/openseaLogo.png"], "philosophy": "Using software processes of his own design, Jason Salavon generates and reconfigures masses of communal material in an effort to present new perspectives on the familiar. Reflecting a natural attraction to popular culture and the day-to-day, his work regularly incorporates the use of common references and source material.", "academic_orientation_ko": "자신이 설계한 소프트웨어로 방대한 공동체 데이터를 생성·재구성해, 부분과 전체·개인과 집단의 관계에서 드러나는 패턴을 탐구한다. 대중문화와 일상의 소재를 통계적·알고리즘적으로 처리함으로써 '평균'과 '전형'이라는 개념 자체를 시각적으로 질문하는, 데이터와 지각의 접점에 선 개념적 성향을 지닌다.", "visual_languages": ["software", "video", "pattern", "popular culture", "photographic", "video installation", "installation"], "key_exhibitions": ["Art Institute of Chicago", "Computation Institute"]}, {"name": "Catherine Sullivan", "title": "Professor, Visual Arts", "url": "https://dova.uchicago.edu/people/catherine-sullivan", "image": "https://dova.uchicago.edu/sites/default/files/styles/header_image/public/2019-09/Sullivan_Header_ForWeb_0.jpg?itok=T0mNIoGP", "email": "", "office": "Logan Center 240", "teaching_since": "", "homepage": "", "bio": "Catherine Sullivan has created film, theater, and installation work nationally and internationally. The performers in her works are often coping with written texts, stylistic economies, re-enactments of historic performances, gestural and choreographic regimes, and conceptual orthodoxies. Her true medium is the ensemble itself. Solo exhibitions, collaborations, performances and films have been presented at venues such as UCLA Armand Hammer Museum, Los Angeles; Walker Art Center, Minneapolis; The Renaissance Society at the University of Chicago; Museum of Contemporary Art, Chicago; Whitney Museum of American Art, New York; Metro Pictures, New York; Galerie Catherine Bastide, Brussels, Galerie Christian Nagel, Cologne; Secession, Vienna; Tate Modern, London; Opéra de Lyon, Lyon; Volksbühne, Berlin; Cricoteka, Krakow; Trapdoor Theatre, Chicago; the Whitney, Moscow and Gwangju biennials; Berlin International Film Festival and International Film Festival Rotterdam. Her work is held in public and private collections including Museum of Contemporary Art, Los Angeles; Whitney Museum of American Art, New York; Tate Modern, London; Thyssen-Bornemisza Art Contemporary, Vienna; Rubell Family Foundation, Miami and Geotz Collection, Munich. Notable awards include The Louis Comfort Tiffany Foundation, Herb Alpert Award in the Arts, Deutscher Akademischer Austausch Dienst, United States Artists Walker Fellowship and a Chicago Dancemaker’s Forum Lab Artist Award. She holds a BFA in acting from California Institute of the Arts and an MFA in post-studio art from Art Center College of Design. She is a Professor in the Department of Visual Arts at the University of Chicago.", "bio_ko": "캐서린 설리번은 국내외에서 영화, 연극, 설치 작업을 만들어왔다. 그의 작업 속 퍼포머들은 종종 문자 텍스트, 양식적 절제, 역사적 퍼포먼스의 재연(re-enactment), 제스처적·안무적 체계, 개념적 정통성과 씨름한다. 그의 진정한 매체는 앙상블 그 자체다. UCLA 아먼드 해머 뮤지엄, 미니애폴리스 워커 아트센터, 시카고 대학교 르네상스 소사이어티, 시카고 현대미술관, 뉴욕 휘트니 미술관, 뉴욕 Metro Pictures, 브뤼셀 Galerie Catherine Bastide, 쾰른 Galerie Christian Nagel, 빈 Secession, 런던 테이트 모던, 리옹 오페라, 베를린 Volksbühne, 크라쿠프 Cricoteka, 시카고 Trapdoor Theatre, 휘트니·모스크바·광주 비엔날레, 베를린 국제영화제, 로테르담 국제영화제 등에서 개인전, 협업, 퍼포먼스, 영화를 선보였다. 그의 작업은 LA 현대미술관, 뉴욕 휘트니 미술관, 런던 테이트 모던, 빈 티센-보르네미사 현대미술관, 마이애미 Rubell Family Foundation, 뮌헨 Goetz Collection 등 공공·개인 컬렉션에 소장되어 있다. 루이스 컴포트 티파니 재단, 예술 부문 허브 알퍼트상, 독일학술교류처(DAAD), United States Artists 워커 펠로우십, 시카고 댄스메이커스 포럼 랩 아티스트상 등을 수상했다. 캘리포니아 예술대학(CalArts)에서 연기 전공 BFA를, Art Center College of Design에서 포스트스튜디오 아트 전공 MFA를 받았으며, 현재 시카고 대학교 미술학과 교수로 재직 중이다.", "events": [], "artwork_images": ["https://dova.uchicago.edu/sites/default/files/styles/header_image/public/2019-09/Sullivan_Header_ForWeb_0.jpg?itok=T0mNIoGP"], "philosophy": "The performers in her works are often coping with written texts, stylistic economies, re-enactments of historic performances, gestural and choreographic regimes, and conceptual orthodoxies. Her true medium is the ensemble itself.", "academic_orientation_ko": "연극, 퍼포먼스, 영상을 결합하는 융합 아티스트로, 과거 역사 속 논란이나 스캔들이 되었던 예술적 사건이나 아카이브 문헌을 수집한다. 이를 배우들의 조율된 신체 연기로 재구성(Reenactment)해 전시관에 설치함으로써, 과거의 서사가 오늘날 어떻게 다시 소비되고 정치적으로 작동하는지를 집요하게 추적한다.", "visual_languages": ["film", "performance", "theater", "installation", "re-enactment", "gestural", "ensemble", "labor", "biennial"], "key_exhibitions": ["UCLA Armand Hammer Museum", "Walker Art Center", "Museum of Contemporary Art", "Whitney Museum of American Art", "Galerie", "Tate Modern", "Whitney", "Berlin International Film Festival"]}, {"name": "Anna Martine Whitehead", "title": "Faculty", "url": "https://dova.uchicago.edu/people/anna-martine-whitehead", "image": "https://dova.uchicago.edu/sites/default/files/styles/header_image/public/2025-12/SPREAD_Luna_LinksHall_17_smaller.jpg?itok=XhFblYKs", "email": "", "office": "Logan Center 240", "teaching_since": "Teaching at UChicago since 2025", "homepage": "", "bio": "Anna Martine Whitehead does performance from the homelands of the Council of the Three Fires; as well as the Miami, Ho-Chunk, Sauk and Meskwaki; the Kiikaapoi, Peoria, and the Očeti Šakówiŋ Nations. They hold an MFA in Social Practice from California College of the Arts and a BA in fine art with a certificate in Black Women’s Studies from the University of Maryland. Their work attends to queer and black temporalities, insurgent architectures, prison culture, and legacies of critical fabulation. Their solo and collaborative work has been presented by the Chicago Museum of Contemporary Art, REDCAT, Portland Institute for Contemporary Art, Chicago Symphony Orchestra, the Museum of Modern Art, and Yerba Buena Center for the Arts. Martine and her work have been recognized by United States Artists, the New England Foundation for the Arts, National Performance Network, the Graham Foundation, Vera List Center for Art and Politics, MAP Fund, Dance/USA, 3Arts, and the Foundation for Contemporary Arts. Martine has written about blackness, queerness, and bodies in action and contributed chapters to a range of publications including Black Social Dance: Embodied Geographies of Freedom (forthcoming); In the Horizontal Plane: taisha paggett performance works (Soberscove, forthcoming); Queer Dance: Meanings and Makings (Oxford, 2017); and Platforms: Ten Years of Chances Dances (2016). Martine is the author of TREASURE| My Black Rupture (Thread Makes Blanket, 2016).", "bio_ko": "애나 마틴 화이트헤드는 삼불 협의회(Council of the Three Fires)의 땅, 그리고 마이애미, 호청크, 사우크와 메스콰키, 키카푸, 페오리아, 오체티 샤코윙 네이션의 땅에서 퍼포먼스를 만든다. 캘리포니아 예술대학(CCA)에서 사회적 실천(Social Practice) 전공 MFA를, 메릴랜드 대학교에서 순수미술 학사(흑인여성학 자격증 병행)를 받았다. 그의 작업은 퀴어와 흑인의 시간성, 반란적 건축(insurgent architecture), 감옥 문화, 비판적 우화(critical fabulation)의 유산에 주목한다. 그의 개인 및 협업 작업은 시카고 현대미술관, REDCAT, 포틀랜드 현대미술연구소(PICA), 시카고 심포니 오케스트라, 뉴욕 현대미술관, Yerba Buena Center for the Arts 등에서 소개되었다. United States Artists, 뉴잉글랜드 예술재단, National Performance Network, 그레이엄 재단, Vera List Center for Art and Politics, MAP Fund, Dance/USA, 3Arts, 현대예술재단(Foundation for Contemporary Arts) 등에서 수상했다. 흑인성, 퀴어성, 행위 중인 몸에 대해 글을 써왔으며 『Black Social Dance: Embodied Geographies of Freedom』(근간), 『In the Horizontal Plane: taisha paggett performance works』(Soberscove, 근간), 『Queer Dance: Meanings and Makings』(옥스퍼드, 2017), 『Platforms: Ten Years of Chances Dances』(2016) 등에 챕터를 기고했다. 『TREASURE | My Black Rupture』(Thread Makes Blanket, 2016)의 저자이기도 하다.", "events": [], "artwork_images": ["https://dova.uchicago.edu/sites/default/files/styles/header_image/public/2025-12/SPREAD_Luna_LinksHall_17_smaller.jpg?itok=XhFblYKs"], "philosophy": "Their work attends to queer and black temporalities, insurgent architectures, prison culture, and legacies of critical fabulation.", "academic_orientation_ko": "퀴어·흑인의 시간성, 반란적 건축(insurgent architecture), 감옥 문화, 비판적 우화(critical fabulation)의 유산에 주목하는 퍼포먼스 작업을 한다. 신체를 통해 인종·젠더·구금 제도가 남긴 역사적 트라우마와 저항의 계보를 재상연하며, 이는 역사와 신체, 사회 구조를 교차시키는 DoVA의 학문적 성향을 잘 보여준다.", "visual_languages": ["performance", "queer", "social practice", "insurgent architecture", "prison culture", "critical fabulation", "labor"], "key_exhibitions": ["Chicago Museum of Contemporary Art", "Portland Institute for Contemporary Art", "Museum of Modern Art", "Yerba Buena Center", "New England Foundation", "Graham Foundation", "Vera List Center for Art", "Foundation for Contemporary Arts"]}]</script>
<script id="alumni-data" type="application/json">[{"name": "Betty Young Kim (베티 영 킴)", "title": "DoVA MFA Alumna (Class of 2024)", "type": "alumni", "url": "", "image": "https://bettykimphoto.com/wp-content/uploads/2024/05/Pain-Adjacent-Series-1.jpg", "homepage": "https://bettykimphoto.com/", "current_activity_ko": "시카고의 역사 깊은 여성 미술 대안 공간인 Woman Made Gallery 및 Oak Park Art League(OPAL) 등에서 작품을 전시하고 아티스트 토크를 진행하며, 현지 현대미술계에서 독립 작가로 커리어를 구축하고 있다.", "bio": "Betty Young Kim is a Korean-American artist who graduated from the University of Chicago DoVA MFA program in 2024. She has been exhibiting and giving artist talks at Chicago spaces including Woman Made Gallery and the Oak Park Art League (OPAL), building a career as an independent artist in the local contemporary art scene. Her practice combines photography, fiber art (including hanbok fabric), and sculpture. She investigates the experience of immigrant women, the labor value of motherhood, and postcolonial feminism. Through self-portraiture, she visualizes the historical wounds and labor of Korean women and families that have been marginalized or erased from national archives and popular culture.", "bio_ko": "베티 영 킴은 2024년 시카고 대학교 DoVA MFA를 졸업한 한인 작가로, 현재 시카고를 기반으로 활발히 활동하고 있다. 시카고의 역사 깊은 여성 미술 대안공간인 Woman Made Gallery, Oak Park Art League(OPAL) 등에서 작품을 전시하고 아티스트 토크를 진행하며 독립 작가로서 탄탄한 커리어를 구축하고 있다. 사진, 섬유미술(한복 패브릭 등), 조각을 융합해 작업하며, 이민자 여성으로서의 경험, 모성(Motherhood)의 노동 가치, 포스트콜로니얼 페미니즘을 탐구한다. 자화상(Self-portraiture)을 통해 국가 아카이브나 대중문화에서 소외되고 가려졌던 한국 여성과 가족의 역사적 상처와 노동을 시각화하는 개념적이고 지적인 작업을 펼치고 있다.", "events": [{"title": "Chat About: Betty Kim & Charlie Kang | Iona Liu & Lucia Wang", "url": "https://arthistory.uchicago.edu/happenings/events/chat-about-betty-kim-charlie-kang-iona-liu-lucia-wang", "date": "31 March 2023 7:00PM", "host": "Department of Art History", "location": "Logan Center, Room 802"}], "artwork_images": ["https://bettykimphoto.com/wp-content/uploads/2024/05/Pain-Adjacent-Series-1.jpg"], "philosophy": "Her practice combines photography, fiber art (including hanbok fabric), and sculpture. She investigates the experience of immigrant women, the labor value of motherhood, and postcolonial feminism.", "visual_languages": ["labor", "photography", "fiber art", "hanbok", "sculpture", "motherhood", "postcolonial", "postcolonial feminism", "self-portraiture", "portraiture"], "key_exhibitions": ["Woman Made Gallery"]}, {"name": "Jin Charlie Kang (진 찰리 강)", "title": "UChicago MA Alumna (Art History & Curatorial Options) · Curatorial & Exhibitions Administrator, LACMA", "type": "alumni", "url": "", "image": "", "homepage": "https://www.linkedin.com/in/jin-charlie-kang-97a680143/", "current_activity_ko": "2024년 1월부터 로스앤젤레스 카운티 미술관(LACMA)에서 Curatorial & Exhibitions Administrator로 재직 중이며, 그 이전에는 시카고의 여러 미술 기관에서 큐레이토리얼·전시 실무 경력을 쌓았다.", "bio": "Jin Charlie Kang is an art and cultural worker whose career spans curatorial and exhibitions roles at several major US museums. She currently serves as Curatorial & Exhibitions Administrator at the Los Angeles County Museum of Art (LACMA), a role she has held since January 2024. Kang earned a BA in Visual and Critical Studies from the School of the Art Institute of Chicago (2017-2021, Leadership Award, SAIC Merit Scholarship) and a Master of Arts in the Humanities from the University of Chicago (2022-2023, merit-based scholarship), focusing on Art History and Curatorial Options. Her prior curatorial and exhibitions experience includes the Smart Museum of Art at the University of Chicago (Transpacific Graduate Curatorial Intern), the Art Institute of Chicago (Asian Art Curatorial Intern; Ryan Learning Center Summer Intern; Andrew W. Mellon Curatorial Summer Academy participant), the Hyde Park Art Center (Exhibitions Intern), and several years at SAIC's own galleries as a gallery assistant, technician, and installation director, alongside a role as Associate Creative Director for Artists Need Art Historians (ANAH). As an artist, working primarily in painting and drawing, her practice has included pieces made with hanbok fabric and archival pigment prints; her research and writing engage the value embedded in operational labor and maintenance work within cultural institutions, alongside contemporary East Asian and global art and politics, including the March 2023 'Chat About' workshop with Betty Kim, hosted by the University of Chicago's Department of Art History.", "bio_ko": "진 찰리 강은 여러 미국 주요 미술관에서 큐레이토리얼·전시 실무 경력을 쌓아온 아트·문화 종사자다. 2024년 1월부터 로스앤젤레스 카운티 미술관(LACMA)에서 Curatorial & Exhibitions Administrator로 재직 중이다. 시카고 예술대학(SAIC)에서 Visual and Critical Studies 전공 학사(2017~2021, Leadership Award, SAIC Merit Scholarship)를, 시카고 대학교에서 인문학 석사(MAPH, 2022~2023, 성적 우수 장학금)를 Art History and Curatorial Options 트랙으로 마쳤다. 이전에는 시카고 대학교 스마트 미술관(Transpacific Graduate Curatorial Intern), 시카고 아트 인스티튜트(Asian Art Curatorial Intern, Ryan Learning Center Summer Intern, Andrew W. Mellon Curatorial Summer Academy 참가자), 하이드 파크 아트센터(Exhibitions Intern), 그리고 SAIC 갤러리에서 수년간 갤러리 어시스턴트·테크니션·설치 디렉터로 근무했으며, Artists Need Art Historians(ANAH)의 Associate Creative Director도 지냈다. 작가로서는 회화와 드로잉을 중심으로 한복 패브릭과 아카이벌 피그먼트 프린트를 활용한 작업을 선보였으며, 문화 기관 내 운영적 노동(Operational Labor)과 유지 보수 작업(Maintenance)에 깃든 가치, 그리고 동시대 동아시아 및 국제 미술·정치를 다루는 연구와 글쓰기를 이어가고 있다. 2023년 3월 베티 킴과 함께한 시카고 대학교 미술사학과 주최 'Chat About' 워크숍이 대표적이다.", "events": [{"title": "Chat About: Betty Kim & Charlie Kang | Iona Liu & Lucia Wang", "url": "https://arthistory.uchicago.edu/happenings/events/chat-about-betty-kim-charlie-kang-iona-liu-lucia-wang", "date": "31 March 2023 7:00PM", "host": "Department of Art History", "location": "Logan Center, Room 802"}], "artwork_images": [], "philosophy": "Jin Charlie Kang is an art and cultural worker whose career spans curatorial and exhibitions roles at several major US museums. Her research and writing engage the value embedded in operational labor and maintenance work within cultural institutions, alongside contemporary East Asian and global art and politics.", "visual_languages": ["art preparator", "curatorial practice", "painting", "drawing", "operational labor", "labor", "hanbok", "installation"], "key_exhibitions": ["LACMA — Curatorial & Exhibitions Administrator (2024–present)", "Smart Museum of Art, UChicago — Transpacific Graduate Curatorial Intern (2022–2023)", "Art Institute of Chicago — Asian Art Curatorial Intern (2021)", "Art Institute of Chicago — Ryan Learning Center Summer Intern (2022)", "Hyde Park Art Center — Exhibitions Intern (2021–2022)", "Chat About: Betty Kim & Charlie Kang | Iona Liu & Lucia Wang (31 March 2023 7:00PM)"]}]</script>

of inquiry)로 다루는 인문학적 아티스트 집단입니다. 아래 4가지 주제는 교수진의 작업·연구 철학에서 반복적으로 드러나는 공통된 학문적 성향입니다.", "themes": [{"title": "예술을 통한 사회·정치·경제 구조의 해체", "description": "우리를 둘러싼 눈에 보이지 않는 권력과 경제 시스템을 시각 예술을 통해 물질화하고 비판하는 성향.", "examples": ["Geof Oppenheimer — 조각·영상 작업으로 노동, 계급, 자본주의 시스템을 정면으로 다룸. 화이트칼라 정장이 조각상 발목에 흘러내린 '당혹스러운 조각(Embarrassing Sculpture)'이나 중장비와 대리석을 결합한 작업으로, 자본주의 구조가 개인의 신체·정신에 가하는 압력을 조각 언어로 질문함.", "Julia Phillips — 세라믹·금속 장치로 신체를 구속하거나 지지하는 조각을 통해, 개인 간 또는 개인과 제도 간 권력 구조와 젠더·인종을 둘러싼 사회적 시스템을 신체적 경험(Bodily Experience)으로 시각화."]}, {"title": "역사적 텍스트와 퍼포먼스의 개념적 재구성", "description": "역사나 예술사를 고정된 과거가 아니라 끊임없이 현재와 충돌하며 재해석되어야 하는 텍스트로 다루는 성향.", "examples": ["Catherine Sullivan — 연극·퍼포먼스·영상을 결합해, 역사 속 논란·스캔들이 된 예술적 사건이나 아카이브 문헌을 배우들의 조율된 신체 연기로 재구성(Reenactment)함으로써 과거의 서사가 오늘날 어떻게 재소비·재정치화되는지 추적."]}, {"title": "일상적 매체의 전복과 지각(Perception)에 대한 의문", "description": "매체를 단순한 재현 도구로 다루지 않고, 우리가 세상을 바라보는 방식 자체를 의심하게 만드는 성향.", "examples": ["Laura Letinsky — 17세기 네덜란드 정물화의 구도를 현대 소비사회와 연결 짓는 사진 작업. 식사 후 남은 음식 찌꺼기, 찌그러진 일회용 컵이 테이블 가장자리에 걸쳐진 풍경을 자연광으로 담아, 완벽함에 대한 환상을 깨는 일상의 잔해이자 사진 매체·지각의 불완전성을 폭로."]}, {"title": "학제 간 융합(Interdisciplinary Orientation)", "description": "순수 예술의 경계에 갇히지 않고, 강의·세미나가 미술사뿐 아니라 철학, 미학, 사회학, 정신분석학, 인류학, 정치학과 끊임없이 교차하는 성향.", "examples": ["Geof Oppenheimer는 미술학과뿐 아니라 정치학과(Political Science) 부교수를 겸임하며 예술적 실천과 정치 이론을 직접 연결."]}], "summary": "DoVA 교수진의 학문적 성향을 한 단어로 축약하면 '지적 끈질김(Intellectual Rigor)'입니다.", "application_tip": "포트폴리오나 에세이를 쓸 때, 단순히 작업의 시각적 양식을 설명하기보다 다음 질문에 답하는 논리 흐름을 구축하는 것이 좋습니다: '나의 예술적·매체적 실험(포트폴리오)은, 현대 사회가 마주한 어떠한 담론(철학적·사회적·역사적 맥락)을 탐구하기 위한 고유한 질문 기계인가?' 작업 프로세스에 개입하는 학문적·이론적 동기를 교수진의 연구 키워드(예: 권력 구조, 매체의 한계, 역사적 재현 등)와 은근히 정렬시키면 교수진의 이목을 끄는 데 효과적입니다."}, "portfolio_strategy": {"intro": "20개의 이미지를 연도순이나 크기순으로 무작위로 나열하지 말고, 심사위원(교수)이 화면을 넘길 때 지원자의 생각 흐름을 따라갈 수 있도록 '기승전결'이 있는 시각 논문(Visual Thesis)으로 시퀀싱해야 합니다.", "sequencing_stages": [{"range": "1~3번 (The Hook)", "description": "가장 강력하고, 매체적(Material) 특성이 잘 드러나며, 질문이 명확한 작품을 배치. 첫 3장을 넘길 때 교수들이 '이 학생이 어떤 개념(Concept)에 꽂혀 있구나'를 즉각 파악하게 만들어야 함."}, {"range": "4~15번 (The Body / Process & Expansion)", "description": "초반에 던진 질문(개념)을 다른 매체나 다른 각도에서 실험한 작업을 배치. DoVA는 융합(Interdisciplinary)을 매우 중시하므로, 조각 작업이라면 그 조각을 만드는 과정의 퍼포먼스 비디오 컷, 혹은 조각을 피사체로 삼아 의도적으로 왜곡한 사진 작업 등을 교차 배치해 매체를 자유자재로 넘나드는 유연성을 보여줄 것."}, {"range": "16~19번 (The Climax & Detail)", "description": "가장 스케일이 크거나 최근에 몰두하고 있는 심화된 작업을 배치. 반드시 매우 클로즈업된 디테일 컷(Macro shots) 1~2장을 포함 (예: 캔버스의 가장자리 마감, 설치물의 접합부, 도자의 미세한 질감). DoVA 교수들은 텍스트적인 지적 능력 못지않게 '물질에 대한 집요함(Material Intelligence)'을 꼼꼼히 봄."}, {"range": "20번 (The Open Ending)", "description": "완벽하게 끝난 작품보다, '시카고대 DoVA 2년 동안 파고들고 싶은 다음 단계의 스케치나 실험작'을 배치해 발전 가능성을 암시하는 것도 좋은 전략."}], "slideroom_text_tips": {"intro": "Slideroom에 이미지를 업로드할 때 제목, 연도, 크기, 재료를 적는 칸은 단순한 정보 기입란이 아니라 미니 에세이(Mini-statement)입니다.", "common_mistake": "무제(Untitled), 2023, Oil on canvas, 100x100cm", "better_practice": "재료 란을 적극적으로 활용해 매체적 맥락을 더할 것. 예: \"Oil and collected domestic dust on canvas\" (기름과 수집된 가정용 먼지)", "description_field_tip": "각 이미지마다 1~2문장으로 그 작품이 어떤 이론적 배경이나 문화적 비평(Cultural critique)에서 출발했는지 짧고 명확하게 기술. \"이 작업은 아티스트 스테이트먼트에서 언급한 OOO 개념의 시각적 실험이다\"처럼 에세이와의 연결 고리를 만들 것."}, "pitfalls": ["단순한 기술 과시용 습작(인체 드로잉, 투시도 연습, 수업 과제용 프롬프트 그림)은 절대 넣지 말 것 — DoVA는 '손기술(Technical skills)'이 아니라 '자기 주도적 탐구(Sustained Inquiry)'를 하는 예술가를 선발함.", "파편화된 뷔페식 구성 금지 — 20점이 5명의 다른 사람이 한 것처럼 뚝뚝 끊기면 안 됨. 매체는 달라도(사진, 조각, 회화) 모든 작품을 관통하는 하나의 철학적 줄기(Conceptual Cohesion)가 반드시 있어야 함."], "summary": "가장 중요한 것은 '포트폴리오 20점'과 '아티스트 스테이트먼트(에세이)'가 완전히 한 몸처럼 움직여야 한다는 것. 글에서 주장한 철학적 탐구가 시각물로 증명되고, 시각물에서 미처 다 설명하지 못한 맥락이 글로 채워지는 상호 보완적 구조를 완성할 것. 교수진이 포트폴리오 20점을 다 넘겼을 때 '이 학생은 이미 자기만의 세계를 구축했고, 이론적으로 조금만 밀어주면 엄청난 작가가 되겠다'는 확신을 주는 것이 목표."}}</script>
<script>
  const faculty = JSON.parse(document.getElementById('faculty-data').textContent);
  const alumni = JSON.parse(document.getElementById('alumni-data').textContent);
  const admissionInfo = JSON.parse(document.getElementById('admission-data').textContent);
  const listEl = document.getElementById('list');
  const detailEl = document.getElementById('detail');

  const infoBtn = document.createElement('button');
  infoBtn.textContent = '📋 DoVA 지원 요건 & 내 점수';
  infoBtn.className = 'info-btn divider';
  infoBtn.addEventListener('click', () => {
    document.querySelectorAll('#list button').forEach(b => b.classList.remove('active'));
    infoBtn.classList.add('active');
    showInfoPage(admissionInfo);
  });
  listEl.appendChild(infoBtn);

  const facultyLabel = document.createElement('div');
  facultyLabel.className = 'section-label';
  facultyLabel.textContent = '교수진 (Faculty)';
  listEl.appendChild(facultyLabel);

  faculty.forEach((person, idx) => {
    const btn = document.createElement('button');
    btn.textContent = person.name;
    btn.addEventListener('click', () => {
      document.querySelectorAll('#list button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      showDetail(person);
    });
    listEl.appendChild(btn);
  });

  if (alumni.length > 0) {
    const alumniLabel = document.createElement('div');
    alumniLabel.className = 'section-label';
    alumniLabel.textContent = '한국인 DoVA 동문 (Alumni)';
    listEl.appendChild(alumniLabel);

    alumni.forEach((person) => {
      const btn = document.createElement('button');
      btn.textContent = person.name;
      btn.addEventListener('click', () => {
        document.querySelectorAll('#list button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        showDetail(person);
      });
      listEl.appendChild(btn);
    });
  }

  function showDetail(person) {
    detailEl.innerHTML = '';

    const grid = document.createElement('div');
    grid.className = 'detail-grid';

    const textCol = document.createElement('div');
    textCol.className = 'detail-text';

    const h1 = document.createElement('h1');
    h1.textContent = person.name;
    textCol.appendChild(h1);

    if (person.title) {
      const p = document.createElement('div');
      p.className = 'meta';
      p.textContent = person.title;
      textCol.appendChild(p);
    }
    if (person.office) {
      const p = document.createElement('div');
      p.className = 'meta';
      p.textContent = person.office;
      textCol.appendChild(p);
    }
    if (person.teaching_since) {
      const p = document.createElement('div');
      p.className = 'meta';
      p.textContent = person.teaching_since;
      textCol.appendChild(p);
    }
    if (person.email) {
      const p = document.createElement('div');
      p.className = 'meta';
      const a = document.createElement('a');
      a.href = 'mailto:' + person.email;
      a.textContent = person.email;
      p.appendChild(a);
      textCol.appendChild(p);
    }
    if (person.homepage) {
      const p = document.createElement('div');
      p.className = 'meta';
      const a = document.createElement('a');
      a.href = person.homepage;
      a.target = '_blank';
      a.rel = 'noopener';
      a.textContent = person.homepage;
      p.appendChild(a);
      textCol.appendChild(p);
    }
    if (person.url) {
      const p = document.createElement('div');
      p.className = 'meta';
      const a = document.createElement('a');
      a.href = person.url;
      a.target = '_blank';
      a.rel = 'noopener';
      a.textContent = 'DoVA 프로필 페이지 원문';
      p.appendChild(a);
      textCol.appendChild(p);
    }

    const bioLabel = document.createElement('div');
    bioLabel.className = 'bio-label';
    bioLabel.textContent = 'Bio (English)';
    textCol.appendChild(bioLabel);

    const bio = document.createElement('div');
    bio.className = 'bio';
    bio.textContent = person.bio;
    textCol.appendChild(bio);

    if (person.bio_ko) {
      const bioKoLabel = document.createElement('div');
      bioKoLabel.className = 'bio-label';
      bioKoLabel.textContent = '소개 (한국어)';
      textCol.appendChild(bioKoLabel);

      const bioKo = document.createElement('div');
      bioKo.className = 'bio';
      bioKo.textContent = person.bio_ko;
      textCol.appendChild(bioKo);
    }

    if (person.current_activity_ko) {
      const actWrap = document.createElement('div');
      actWrap.className = 'analysis';
      const h2 = document.createElement('h2');
      h2.textContent = '현재 활동';
      actWrap.appendChild(h2);
      const p = document.createElement('p');
      p.textContent = person.current_activity_ko;
      actWrap.appendChild(p);
      textCol.appendChild(actWrap);
    }

    if (person.philosophy || person.academic_orientation_ko ||
        (person.visual_languages && person.visual_languages.length > 0)) {
      const analysisWrap = document.createElement('div');
      analysisWrap.className = 'analysis';

      if (person.philosophy) {
        const h2 = document.createElement('h2');
        h2.textContent = '예술 철학';
        analysisWrap.appendChild(h2);
        const p = document.createElement('p');
        p.className = 'philosophy';
        p.textContent = person.philosophy;
        analysisWrap.appendChild(p);
      }

      if (person.academic_orientation_ko) {
        const h2 = document.createElement('h2');
        h2.textContent = '학문적 성향';
        analysisWrap.appendChild(h2);
        const p = document.createElement('p');
        p.textContent = person.academic_orientation_ko;
        analysisWrap.appendChild(p);
      }

      if (person.visual_languages && person.visual_languages.length > 0) {
        const h2 = document.createElement('h2');
        h2.textContent = '표현 언어 (Visual Languages)';
        analysisWrap.appendChild(h2);
        const tags = document.createElement('div');
        tags.className = 'keyword-tags';
        person.visual_languages.forEach(kw => {
          const tag = document.createElement('span');
          tag.className = 'keyword-tag';
          tag.textContent = kw;
          tags.appendChild(tag);
        });
        analysisWrap.appendChild(tags);
      }

      if (person.key_exhibitions && person.key_exhibitions.length > 0) {
        const h2 = document.createElement('h2');
        h2.textContent = '대표 전시 및 성과';
        analysisWrap.appendChild(h2);
        const ul = document.createElement('ul');
        ul.className = 'exhibition-list';
        person.key_exhibitions.forEach(item => {
          const li = document.createElement('li');
          li.textContent = item;
          ul.appendChild(li);
        });
        analysisWrap.appendChild(ul);
      }

      const note = document.createElement('div');
      note.className = 'review-note';
      note.textContent = '※ 위 철학/표현 언어/전시 항목은 자동 추출된 참고 자료이며, 실제 인용 전 원문 확인을 권장합니다.';
      analysisWrap.appendChild(note);

      textCol.appendChild(analysisWrap);
    }

    if (person.events && person.events.length > 0) {
      const eventsWrap = document.createElement('div');
      eventsWrap.className = 'events';
      const h2 = document.createElement('h2');
      h2.textContent = 'Related Events';
      eventsWrap.appendChild(h2);
      person.events.forEach(ev => {
        const evEl = document.createElement('div');
        evEl.className = 'event';
        const title = document.createElement('a');
        title.href = ev.url;
        title.target = '_blank';
        title.rel = 'noopener';
        title.textContent = ev.title;
        evEl.appendChild(title);
        const info = document.createElement('div');
        info.textContent = [ev.date, ev.host, ev.location].filter(Boolean).join(' · ');
        evEl.appendChild(info);
        eventsWrap.appendChild(evEl);
      });
      textCol.appendChild(eventsWrap);
    }

    grid.appendChild(textCol);

    if (person.image) {
      const imageCol = document.createElement('div');
      imageCol.className = 'detail-image';
      const img = document.createElement('img');
      img.src = person.image;
      img.alt = person.name;
      imageCol.appendChild(img);
      grid.appendChild(imageCol);
    }

    detailEl.appendChild(grid);
  }

  function addSection(container, titleText) {
    const section = document.createElement('section');
    const h2 = document.createElement('h2');
    h2.textContent = titleText;
    section.appendChild(h2);
    container.appendChild(section);
    return section;
  }

  function showInfoPage(info) {
    detailEl.innerHTML = '';

    const page = document.createElement('div');
    page.className = 'info-page';

    const h1 = document.createElement('h1');
    h1.textContent = 'DoVA 지원 요건 & 내 점수';
    page.appendChild(h1);

    // my scores
    const scoreSection = addSection(page, '내 어학 점수 (TOEFL)');
    const cards = document.createElement('div');
    cards.className = 'score-cards';
    const scoreEntries = [
      ['총점 (뉴토플)', info.my_scores.toefl_new_total],
      ['총점 (구토플 환산)', info.my_scores.toefl_old_total],
      ['Reading', info.my_scores.reading],
      ['Listening', info.my_scores.listening],
      ['Speaking', info.my_scores.speaking],
      ['Writing', info.my_scores.writing],
    ];
    scoreEntries.forEach(([label, value]) => {
      const card = document.createElement('div');
      card.className = 'score-card';
      const l = document.createElement('div');
      l.className = 'label';
      l.textContent = label;
      const v = document.createElement('div');
      v.className = 'value';
      v.textContent = value;
      card.appendChild(l);
      card.appendChild(v);
      cards.appendChild(card);
    });
    scoreSection.appendChild(cards);

    // required documents
    const docsSection = addSection(page, '제출 서류 요건');
    const docsTable = document.createElement('table');
    docsTable.innerHTML = '<tr><th>구분</th><th>제출 요건 및 상세 내용</th><th>준비 팁</th></tr>';
    info.required_documents.forEach(doc => {
      const tr = document.createElement('tr');
      const c1 = document.createElement('td');
      c1.textContent = doc.item;
      const c2 = document.createElement('td');
      c2.textContent = doc.requirement;
      const c3 = document.createElement('td');
      c3.className = 'tip';
      c3.textContent = doc.tip;
      tr.appendChild(c1);
      tr.appendChild(c2);
      tr.appendChild(c3);
      docsTable.appendChild(tr);
    });
    docsSection.appendChild(docsTable);

    // faculty academic orientation
    if (info.faculty_academic_orientation) {
      const fao = info.faculty_academic_orientation;
      const faoSection = addSection(page, 'DoVA 교수진의 학문적 성향');

      const intro = document.createElement('p');
      intro.textContent = fao.intro;
      faoSection.appendChild(intro);

      if (fao.themes) {
        const themeList = document.createElement('div');
        themeList.className = 'stage-list';
        fao.themes.forEach(theme => {
          const card = document.createElement('div');
          card.className = 'stage-card';
          const title = document.createElement('div');
          title.className = 'range';
          title.textContent = theme.title;
          card.appendChild(title);
          const desc = document.createElement('div');
          desc.textContent = theme.description;
          card.appendChild(desc);
          if (theme.examples && theme.examples.length > 0) {
            const ul = document.createElement('ul');
            ul.className = 'exhibition-list';
            theme.examples.forEach(ex => {
              const li = document.createElement('li');
              li.textContent = ex;
              ul.appendChild(li);
            });
            card.appendChild(ul);
          }
          themeList.appendChild(card);
        });
        faoSection.appendChild(themeList);
      }

      if (fao.summary) {
        const summaryBox = document.createElement('div');
        summaryBox.className = 'summary-box';
        summaryBox.textContent = fao.summary;
        faoSection.appendChild(summaryBox);
      }

      if (fao.application_tip) {
        const tipLabel = document.createElement('div');
        tipLabel.className = 'tip';
        tipLabel.textContent = '지원 전략 적용 팁:';
        faoSection.appendChild(tipLabel);
        const tipP = document.createElement('p');
        tipP.textContent = fao.application_tip;
        faoSection.appendChild(tipP);
      }
    }

    // portfolio strategy
    if (info.portfolio_strategy) {
      const ps = info.portfolio_strategy;
      const psSection = addSection(page, '포트폴리오(20점) 구성 전략');

      const intro = document.createElement('p');
      intro.textContent = ps.intro;
      psSection.appendChild(intro);

      if (ps.sequencing_stages) {
        const h3 = document.createElement('h3');
        h3.textContent = '시퀀싱 전략: 기승전결이 있는 시각 논문 만들기';
        psSection.appendChild(h3);
        const stageList = document.createElement('div');
        stageList.className = 'stage-list';
        ps.sequencing_stages.forEach(stage => {
          const card = document.createElement('div');
          card.className = 'stage-card';
          const range = document.createElement('div');
          range.className = 'range';
          range.textContent = stage.range;
          const desc = document.createElement('div');
          desc.textContent = stage.description;
          card.appendChild(range);
          card.appendChild(desc);
          stageList.appendChild(card);
        });
        psSection.appendChild(stageList);
      }

      if (ps.slideroom_text_tips) {
        const tips = ps.slideroom_text_tips;
        const h3 = document.createElement('h3');
        h3.textContent = 'Slideroom 텍스트 입력란 활용하기';
        psSection.appendChild(h3);
        const tipsIntro = document.createElement('p');
        tipsIntro.textContent = tips.intro;
        psSection.appendChild(tipsIntro);

        const badLabel = document.createElement('div');
        badLabel.className = 'tip';
        badLabel.textContent = '흔한 실수:';
        psSection.appendChild(badLabel);
        const badBlock = document.createElement('div');
        badBlock.className = 'code-block';
        badBlock.textContent = tips.common_mistake;
        psSection.appendChild(badBlock);

        const goodLabel = document.createElement('div');
        goodLabel.className = 'tip';
        goodLabel.textContent = '합격 전략 (재료 란 활용):';
        psSection.appendChild(goodLabel);
        const goodBlock = document.createElement('div');
        goodBlock.className = 'code-block';
        goodBlock.textContent = tips.better_practice;
        psSection.appendChild(goodBlock);

        const descTip = document.createElement('p');
        descTip.className = 'tip';
        descTip.textContent = 'Description(설명)란 활용: ' + tips.description_field_tip;
        psSection.appendChild(descTip);
      }

      if (ps.pitfalls) {
        const h3 = document.createElement('h3');
        h3.textContent = '절대 넣지 말아야 할 것';
        psSection.appendChild(h3);
        const ul = document.createElement('ul');
        ul.className = 'pitfall-list';
        ps.pitfalls.forEach(item => {
          const li = document.createElement('li');
          li.textContent = item;
          ul.appendChild(li);
        });
        psSection.appendChild(ul);
      }

      if (ps.summary) {
        const summaryBox = document.createElement('div');
        summaryBox.className = 'summary-box';
        summaryBox.textContent = ps.summary;
        psSection.appendChild(summaryBox);
      }
    }

    // TA eligibility
    const taSection = addSection(page, '대학원 조교(TA) 영어 자격 요건');
    const taDesc = document.createElement('p');
    taDesc.textContent = info.ta_eligibility.description;
    taSection.appendChild(taDesc);
    const taTable = document.createElement('table');
    taTable.innerHTML = '<tr><th>시험 구분</th><th>무심사 패스 기준</th><th>⚠️ 자체 추가 시험(AEPA) 필요 기준</th></tr>';
    info.ta_eligibility.table.forEach(row => {
      const tr = document.createElement('tr');
      const c1 = document.createElement('td');
      c1.textContent = row.test;
      const c2 = document.createElement('td');
      c2.textContent = row.pass;
      const c3 = document.createElement('td');
      c3.textContent = row.review;
      tr.appendChild(c1);
      tr.appendChild(c2);
      tr.appendChild(c3);
      taTable.appendChild(tr);
    });
    taSection.appendChild(taTable);
    const taNote = document.createElement('p');
    taNote.className = 'tip';
    taNote.textContent = '내 TOEFL Speaking 점수: ' + info.my_scores.speaking + ' → 26점 이상(뉴토플 5.5) 기준을 충족하여 별도 추가 시험 없이 조교 임용이 가능합니다.';
    taSection.appendChild(taNote);

    // score sending
    const sendSection = addSection(page, '영어 성적 송부처 (Where to Send)');
    const sendList = document.createElement('ul');
    const sendItems = [
      'TOEFL 기관 코드: ' + info.score_sending.toefl_code,
      'IELTS: ' + info.score_sending.ielts_note,
      'Account Name: ' + info.score_sending.ielts_account_name,
      'Address: ' + info.score_sending.ielts_address,
    ];
    sendItems.forEach(text => {
      const li = document.createElement('li');
      li.textContent = text;
      sendList.appendChild(li);
    });
    sendSection.appendChild(sendList);

    // contacts
    const contactSection = addSection(page, '문의처 및 연락처 안내');
    const contactList = document.createElement('ul');
    info.contacts.forEach(c => {
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.href = 'mailto:' + c.email;
      a.textContent = c.email;
      li.textContent = c.purpose + ': ';
      li.appendChild(a);
      contactList.appendChild(li);
    });
    contactSection.appendChild(contactList);

    page.appendChild(contactSection);
    detailEl.appendChild(page);
  }

  if (faculty.length > 0) {
    listEl.querySelector('button:not(.info-btn)').click();
  }
</script>
</body>
</html>
